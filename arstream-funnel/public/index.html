<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arstream — Follow</title>
<meta name="description" content="Dancehall & Patois from Arstream. Listen and follow.">
<meta name="theme-color" content="#0d0c0a">
<link rel="preconnect" href="https://open.spotify.com">
<style>
  :root {
    --bg: #0d0c0a;
    --surface: #17150f;
    --line: #2b2719;
    --text: #f4efe2;
    --muted: #b3ab95;
    --accent: #ffcc1a;
    --accent-ink: #1a1400;
    --green: #2fbf71;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  main { max-width: 520px; margin: 0 auto; padding: 24px 16px 0; }
  .hero { display: flex; gap: 16px; align-items: center; }
  .avatar {
    width: 84px; height: 84px; border-radius: 50%; object-fit: cover;
    border: 2px solid var(--accent); flex: none; background: var(--surface);
  }
  .name { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
  .tag { color: var(--muted); margin: 0; font-size: 14px; }
  .kicker {
    display: inline-block; margin: 28px 0 8px; padding: 4px 10px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line);
    color: var(--accent); font-size: 13px; font-weight: 600;
  }
  h1 { font-size: clamp(28px, 8vw, 40px); line-height: 1.1; margin: 0 0 12px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .player {
    border-radius: var(--radius); overflow: hidden; background: var(--surface);
    border: 1px solid var(--line); min-height: 152px;
  }
  .player iframe { display: block; width: 100%; border: 0; }
  .hint { font-size: 13px; color: var(--muted); margin: 8px 2px 24px; }
  .ctas { display: grid; gap: 10px; }
  .cta {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 56px; padding: 0 20px; border-radius: 999px;
    font-weight: 700; font-size: 17px; text-decoration: none;
    border: 1px solid var(--line); color: var(--text); background: var(--surface);
    transition: transform .08s ease;
  }
  .cta:active { transform: scale(.98); }
  .cta.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .cta:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  .proof { margin: 28px 0; padding: 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .proof b { color: var(--text); }
  .sticky {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    transform: translateY(110%); transition: transform .25s ease;
  }
  .sticky.show { transform: none; }
  .sticky .cta { max-width: 520px; margin: 0 auto; }
  .consent {
    position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 10; max-width: 520px; margin: 0 auto;
    padding: 14px; border-radius: var(--radius); background: #221f15; border: 1px solid var(--line);
    font-size: 14px; display: none;
  }
  .consent.show { display: block; }
  .consent button {
    margin: 10px 8px 0 0; min-height: 40px; padding: 0 16px; border-radius: 999px; font-weight: 700;
    border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer;
  }
  .consent button.ok { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 24px 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script src="config.js"></script>
</head>
<body>
<main>
  <section class="hero">
    <img class="avatar" id="avatar" alt="" width="84" height="84">
    <div>
      <p class="name" id="name"></p>
      <p class="tag" id="tagline"></p>
    </div>
  </section>

  <span class="kicker" id="kicker"></span>
  <h1 id="headline"></h1>
  <p class="sub" id="sub"></p>

  <div class="player"><div id="embed"></div></div>
  <p class="hint">Tap play for a quick listen, then follow so you don't miss the next drop.</p>

  <nav class="ctas" id="ctas" aria-label="Follow Arstream"></nav>

  <div class="proof" id="proof">
    <b>Why follow?</b> Following puts new Arstream releases straight into your Release Radar / feed. One tap, no sign-up here.
  </div>
  <footer>Links open the official artist pages.</footer>
</main>

<div class="sticky" id="sticky"></div>

<div class="consent" id="consent" role="dialog" aria-label="Cookies">
  We use cookies to measure which ads bring listeners.
  <div>
    <button class="ok" id="consent-ok">OK</button>
    <button id="consent-no">No thanks</button>
  </div>
</div>

<script>
(function () {
  "use strict";
  const C = window.FUNNEL_CONFIG;
  const qs = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);

  // ---------- storage helpers (never let storage errors break the page) ----------
  const store = {
    get(k, s) { try { return (s ? sessionStorage : localStorage).getItem(k); } catch { return null; } },
    set(k, v, s) { try { (s ? sessionStorage : localStorage).setItem(k, v); } catch {} },
  };

  // ---------- click ids for offline conversion upload ----------
  const clickIds = {};
  for (const k of ["gclid", "wbraid", "gbraid"]) {
    const v = qs.get(k) || store.get("ck_" + k, true);
    if (v) { clickIds[k] = v; store.set("ck_" + k, v, true); }
  }

  // ---------- Google tag + Consent Mode v2 ----------
  const g = C.google || {};
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  window.gtag = gtag;
  const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || "");
  const needsConsent = /^(Europe|Atlantic\/(Reykjavik|Canary|Madeira|Azores))/.test(tz);
  const saved = store.get("consent");
  const granted = saved ? saved === "granted" : !needsConsent;
  const consentState = (v) => ({
    ad_storage: v, ad_user_data: v, ad_personalization: v, analytics_storage: v,
  });
  gtag("consent", "default", consentState(granted ? "granted" : "denied"));
  if (g.adsId || g.ga4Id) {
    const s = document.createElement("script");
    s.async = true;
    s.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(g.adsId || g.ga4Id);
    document.head.appendChild(s);
    gtag("js", new Date());
    if (g.adsId) gtag("config", g.adsId);
    if (g.ga4Id) gtag("config", g.ga4Id);
  }
  if (needsConsent && !saved) $("consent").classList.add("show");
  function setConsent(v) {
    store.set("consent", v);
    gtag("consent", "update", consentState(v));
    $("consent").classList.remove("show");
  }
  $("consent-ok").onclick = () => setConsent("granted");
  $("consent-no").onclick = () => setConsent("denied");

  // ---------- variant selection ----------
  const variants = C.variants;
  const byId = Object.fromEntries(variants.map((v) => [v.id, v]));
  function matchKeyword() {
    const hay = ["utm_term", "utm_content", "keyword", "utm_campaign"]
      .map((k) => (qs.get(k) || "").toLowerCase()).join(" ");
    if (!hay.trim()) return null;
    return variants.find((v) => (v.match || []).some((m) => hay.includes(m))) || null;
  }
  function withTimeout(p, ms) {
    return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
  }
  async function pickVariant() {
    const forced = byId[(qs.get("v") || "").toLowerCase()];
    if (forced) return { v: forced, how: "url" };
    const kw = matchKeyword();
    if (kw) return { v: kw, how: "keyword" };
    if (C.api) {
      try {
        const r = await withTimeout(fetch(C.api + "/variant?arms=" + variants.map((v) => v.id).join(",")), 700);
        const { arm } = await r.json();
        if (byId[arm]) return { v: byId[arm], how: "bandit" };
      } catch {}
    }
    return { v: variants[Math.floor(Math.random() * variants.length)], how: "random" };
  }

  // ---------- platform order ----------
  // Audiomack is strongest in Africa and the Caribbean diaspora; Spotify elsewhere.
  function pickPlatformOrder() {
    const available = C.defaultOrder.filter((p) => C.platforms[p] && C.platforms[p].url);
    const forced = (qs.get("p") || "").toLowerCase();
    let first = available.includes(forced) ? forced : null;
    if (!first && C.platformMode === "auto") {
      const last = store.get("last_platform");
      const ua = navigator.userAgent;
      const lang = (navigator.language || "").toLowerCase();
      if (available.includes(last)) first = last;
      else if (/youtube|ytmusic/i.test(document.referrer + " " + (qs.get("utm_source") || "")) && available.includes("youtube")) first = "youtube";
      else if (/-(ng|gh|ke|tz|ug|za|zm|zw|cm|ci|sn)$/.test(lang) || /^Africa\//.test(tz)) first = "audiomack";
      else if (/Android/i.test(ua) && available.includes("audiomack")) first = "audiomack";
      else if (/iPhone|iPad|Macintosh/i.test(ua) && available.includes("spotify")) first = "spotify";
    }
    return first ? [first, ...available.filter((p) => p !== first)] : available;
  }

  // ---------- events ----------
  let variantId = "unknown";
  let previewed = false;
  const fired = new Set();
  function send(type, extra) {
    if (C.api && variantId !== "unknown") {
      const body = JSON.stringify(Object.assign({ arm: variantId, type }, clickIds, extra || {}));
      try {
        if (!navigator.sendBeacon || !navigator.sendBeacon(C.api + "/event", new Blob([body], { type: "application/json" }))) {
          fetch(C.api + "/event", { method: "POST", body, keepalive: true, headers: { "content-type": "application/json" } }).catch(() => {});
        }
      } catch {}
    }
  }
  const VALUE = { preview_15s: 0.2, follow_click: 0.6, follow_click_after_preview: 1 };
  function conversion(type, extra) {
    if (fired.has(type)) return;
    fired.add(type);
    send(type, extra);
    const label = (g.labels || {})[type];
    if (g.adsId && label) {
      gtag("event", "conversion", {
        send_to: g.adsId + "/" + label, value: VALUE[type], currency: g.currency || "USD",
        transport_type: "beacon",
      });
    }
    if (g.ga4Id) gtag("event", type, Object.assign({ variant: variantId, transport_type: "beacon" }, extra || {}));
  }

  // ---------- render ----------
  function renderCtas(order) {
    const make = (p, primary) => {
      const a = document.createElement("a");
      a.className = "cta" + (primary ? " primary" : "");
      a.href = C.platforms[p].url;
      a.textContent = C.platforms[p].label;
      a.rel = "noopener";
      a.dataset.platform = p;
      a.addEventListener("click", (e) => {
        // Let modified clicks open normally; still count them.
        const type = previewed ? "follow_click_after_preview" : "follow_click";
        store.set("last_platform", p);
        conversion(type, { platform: p });
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
        e.preventDefault();
        // Give the beacon a moment, then hand off to the app / web page.
        setTimeout(() => { location.href = a.href; }, 250);
      });
      return a;
    };
    const nav = $("ctas");
    nav.replaceChildren(...order.map((p, i) => make(p, i === 0)));
    if (order.length) $("sticky").replaceChildren(make(order[0], true));
  }

  function renderVariant(v) {
    $("kicker").textContent = v.kicker;
    $("headline").textContent = v.headline;
    $("sub").textContent = v.sub;
  }

  $("name").textContent = C.artist.name;
  $("tagline").textContent = C.artist.tagline;
  $("avatar").onerror = () => { $("avatar").style.visibility = "hidden"; };
  $("avatar").src = C.artist.avatar;
  $("avatar").alt = C.artist.name;
  renderVariant(variants[0]);
  renderCtas(pickPlatformOrder());

  pickVariant().then(({ v, how }) => {
    variantId = v.id;
    renderVariant(v);
    send("view", { how });
  });

  // Show sticky CTA once the main buttons scroll out of view.
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(([e]) => $("sticky").classList.toggle("show", !e.isIntersecting))
      .observe($("ctas"));
  }

  // ---------- Spotify preview with listen tracking ----------
  window.onSpotifyIframeApiReady = (IFrameAPI) => {
    IFrameAPI.createController($("embed"), { uri: C.previewUri, width: "100%", height: 152 }, (ctl) => {
      let listened = 0, lastPos = null;
      ctl.addListener("playback_update", (e) => {
        const { position, isPaused } = e.data;
        if (!isPaused && lastPos !== null && position > lastPos && position - lastPos < 5000) {
          listened += position - lastPos;
        }
        lastPos = position;
        if (!previewed && listened >= C.previewSeconds * 1000) {
          previewed = true;
          conversion("preview_15s");
          $("sticky").classList.add("show");
        }
      });
    });
  };
  const sp = document.createElement("script");
  sp.src = "https://open.spotify.com/embed/iframe-api/v1";
  sp.async = true;
  document.body.appendChild(sp);
})();
</script>
</body>
</html>
